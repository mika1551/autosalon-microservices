syntax = "proto3";
option java_multiple_files = true;
option java_package = "grpc.car";
option java_outer_classname = "CarInventoryProto";

service CarInventoryService {

  rpc GetAvailableCars(GetAvailableCarsRequest) returns (GetAvailableCarsResponse);
  rpc GetAvailableCarById(GetAvailableCarByIdRequest) returns (CarResponse);

}

message GetAvailableCarsRequest{}

message GetAvailableCarByIdRequest {

  string id = 1;

}

message GetAvailableCarsResponse {

  repeated CarResponse cars = 1;

}

message CarResponse {
  string id = 1;
  string brand = 2;
  string model = 3;
  string color = 4;
  int32 year = 5;
  string basePrice = 6;
  string bodyType = 7;
  string fuelType = 8;
  string engineType = 9;
  string transmissionType = 10;
  int32 horsePower = 11;
  string driveType = 12;
  bool availableForSale = 13;
}
