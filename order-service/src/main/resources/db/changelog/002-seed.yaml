databaseChangeLog:
  - changeSet:
      id: 020-seed-users
      author: Mika
      preConditions:
        onFail: MARK_RAN
        sqlCheck:
          expectedResult: 0
          sql: "select count(*) from users where id='11111111-1111-1111-1111-111111111111'"
      changes:
        - insert:
            tableName: users
            columns:
              - column: { name: id, value: "11111111-1111-1111-1111-111111111111" }
              - column: { name: username, value: "manager1" }
              - column: { name: role, value: "MANAGER" }
        - insert:
            tableName: users
            columns:
              - column: { name: id, value: "22222222-2222-2222-2222-222222222222" }
              - column: { name: username, value: "client1" }
              - column: { name: role, value: "CLIENT" }

  - changeSet:
      id: 021-seed-cars
      author: Mika
      preConditions:
        onFail: MARK_RAN
        sqlCheck:
              expectedResult: 0
              sql: "select count(*) from cars where id='33333333-3333-3333-3333-333333333333'"
      changes:
        - insert:
            tableName: cars
            columns:
              - column: { name: id, value: "33333333-3333-3333-3333-333333333333" }
              - column: { name: brand, value: "BMW" }
              - column: { name: model, value: "320i" }
              - column: { name: base_price, valueNumeric: 3500000.00 }
              - column: { name: available_for_sale, valueBoolean: true }
              - column: { name: available_for_test_drive, valueBoolean: true }
